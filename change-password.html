<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Change Password | Hustlin'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260816-2210">
<style>
.auth-wrap{min-height:100vh;background:#060606;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.auth-logo{margin-bottom:36px}
.auth-logo img{height:56px;width:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.auth-card{background:var(--dark-card);border:1px solid rgba(240,192,48,.2);border-radius:var(--r-lg);padding:38px;max-width:400px;width:100%}
.auth-card h1{color:#fff;font-size:1.4rem;margin-bottom:6px}
.auth-card .auth-sub{color:rgba(255,255,255,.5);font-size:.88rem;margin-bottom:26px}
.auth-field{margin-bottom:16px}
.auth-field label{display:block;font-size:.8rem;color:rgba(255,255,255,.6);margin-bottom:6px;font-weight:600}
.auth-field input{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#fff;font-size:.95rem}
.auth-field input:focus{outline:none;border-color:var(--amber)}
.auth-submit{width:100%;justify-content:center;margin-top:8px}
.auth-msg{font-size:.85rem;margin-top:14px;padding:10px 12px;border-radius:8px;display:none}
.auth-msg.err{background:rgba(255,34,34,.1);color:#ff8080;border:1px solid rgba(255,34,34,.25);display:block}
.auth-msg.ok{background:rgba(45,160,45,.1);color:#8fe08f;border:1px solid rgba(45,160,45,.25);display:block}
.auth-alt{text-align:center;margin-top:20px;font-size:.86rem;color:rgba(255,255,255,.4)}
.auth-alt a{color:var(--amber);text-decoration:underline}
.auth-loading{color:rgba(255,255,255,.5);font-size:.9rem;text-align:center;padding:8px 0}
.auth-who{font-size:.8rem;color:rgba(255,255,255,.45);margin-bottom:20px;padding:9px 12px;border-radius:8px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);word-break:break-all}
</style>
</head>
<body>
<div class="auth-wrap">
  <a class="auth-logo" href="index.html"><img src="assets/hustlin-logo.png" alt="Hustlin'" width="1423" height="572" decoding="async"></a>
  <div class="auth-card">
    <h1>Change Password</h1>
    <div class="auth-sub" id="sub-text">Checking your session…</div>

    <div class="auth-loading" id="checking">One moment.</div>

    <form id="change-form" style="display:none">
      <div class="auth-who" id="who"></div>
      <div class="auth-field">
        <label for="current">Current Password</label>
        <input type="password" id="current" required autocomplete="current-password">
      </div>
      <div class="auth-field">
        <label for="password">New Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="auth-field">
        <label for="password2">Confirm New Password</label>
        <input type="password" id="password2" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-a auth-submit" id="submit-btn">Update Password</button>
      <div class="auth-msg" id="msg"></div>
      <div class="auth-alt"><a href="forgot-password.html">Forgot your current password?</a></div>
    </form>

    <div id="signedout-block" style="display:none">
      <div class="auth-msg err" style="display:block">You need to be signed in to change your password.</div>
      <div class="auth-alt"><a href="login.html?redirect=change-password.html">Sign in</a></div>
    </div>

    <div id="oauth-block" style="display:none">
      <div class="auth-msg err" style="display:block">
        This account signs in with Google, so it has no Hustlin' password to change.
        Manage it in your Google account settings.
      </div>
      <div class="auth-alt"><a href="index.html">Back to the site</a></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.1/dist/umd/supabase.js"></script>
<script src="supabase-config.js?v=20260816-2210"></script>
<script src="app.js?v=20260816-2210"></script>
<script src="auth.js?v=20260816-2210"></script>
<script>
(async function(){
  const checking  = document.getElementById('checking');
  const form      = document.getElementById('change-form');
  const subText   = document.getElementById('sub-text');
  const signedOut = document.getElementById('signedout-block');
  const oauthOnly = document.getElementById('oauth-block');

  function hideChrome(){ checking.style.display = 'none'; }

  // Google-only accounts have no password in Supabase, so signInWithPassword
  // (our re-auth step) could never succeed for them. Detect it up front from
  // the identity list rather than letting them fill the form and fail.
  function hasPasswordIdentity(user){
    const ids = (user && user.identities) || [];
    if(!ids.length) return true;                       // nothing to go on — let them try
    return ids.some(function(i){ return i.provider === 'email'; });
  }

  const user = await window.HFY.auth.getUser();

  if(!user){
    hideChrome();
    subText.textContent = '';
    signedOut.style.display = 'block';
    return;
  }
  if(!hasPasswordIdentity(user)){
    hideChrome();
    subText.textContent = '';
    oauthOnly.style.display = 'block';
    return;
  }

  hideChrome();
  subText.textContent = 'Confirm your current password, then choose a new one.';
  document.getElementById('who').textContent = 'Signed in as ' + (user.email || '');
  form.style.display = 'block';

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');
    msg.className = 'auth-msg';
    msg.textContent = '';

    const cur = document.getElementById('current').value;
    const p1  = document.getElementById('password').value;
    const p2  = document.getElementById('password2').value;

    function fail(text){
      msg.className = 'auth-msg err';
      msg.textContent = text;
      btn.disabled = false;
      btn.textContent = 'Update Password';
    }

    if(p1 !== p2)      return fail("New passwords don't match.");
    if(p1.length < 6)  return fail('New password must be at least 6 characters.');
    if(p1 === cur)     return fail('That is already your current password.');

    btn.disabled = true;
    btn.textContent = 'Updating…';

    try{
      // Re-authenticate first. An active session alone is enough for Supabase
      // to accept updateUser({password}), which means anyone who walks up to
      // an unlocked browser could take the account over. Proving knowledge of
      // the current password closes that. signInWithPassword on the same user
      // just refreshes the existing session, so this is safe to call here.
      const reauth = await window.HFY.auth.signIn(user.email, cur);
      if(reauth.error) return fail('Current password is incorrect.');

      const { error } = await window.HFY.auth.updatePassword(p1);
      if(error) throw error;

      msg.className = 'auth-msg ok';
      msg.textContent = 'Password updated. Signing you out so you can sign back in with it…';
      btn.textContent = 'Done';

      // Sign out so there is no ambiguity about which credentials the live
      // session belongs to, and so any other device holding a stale session
      // is not silently left signed in.
      setTimeout(async function(){
        await window.HFY.auth.signOut();
        window.location.href = 'login.html?reset=1';
      }, 1400);
    }catch(err){
      console.error('change password failed', err);
      fail(err.message || 'Could not update your password. Try again shortly.');
    }
  });
})();
</script>
</body>
</html>
