<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Set New Password | Hustlin'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=202608011016">
<style>
.auth-wrap{min-height:100vh;background:#060606;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.auth-logo{margin-bottom:36px}
.auth-logo img{height:56px;width:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.auth-card{background:var(--dark-card);border:1px solid rgba(240,192,48,.2);border-radius:var(--r-lg);padding:38px;max-width:400px;width:100%}
.auth-card h1{color:#fff;font-size:1.4rem;margin-bottom:6px}
.auth-card .auth-sub{color:rgba(255,255,255,.5);font-size:.88rem;margin-bottom:26px}
.auth-field{margin-bottom:16px}
.auth-field label{display:block;font-size:.8rem;color:rgba(255,255,255,.6);margin-bottom:6px;font-weight:600}
.auth-field input{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#fff;font-size:.95rem}
.auth-field input:focus{outline:none;border-color:var(--amber)}
.auth-submit{width:100%;justify-content:center;margin-top:8px}
.auth-msg{font-size:.85rem;margin-top:14px;padding:10px 12px;border-radius:8px;display:none}
.auth-msg.err{background:rgba(255,34,34,.1);color:#ff8080;border:1px solid rgba(255,34,34,.25);display:block}
.auth-msg.ok{background:rgba(45,160,45,.1);color:#8fe08f;border:1px solid rgba(45,160,45,.25);display:block}
.auth-alt{text-align:center;margin-top:20px;font-size:.86rem;color:rgba(255,255,255,.4)}
.auth-alt a{color:var(--amber);text-decoration:underline}
.auth-loading{color:rgba(255,255,255,.5);font-size:.9rem;text-align:center;padding:8px 0}
</style>
</head>
<body>
<div class="auth-wrap">
  <a class="auth-logo" href="index.html"><img src="assets/hustlin-logo.png" alt="Hustlin'"></a>
  <div class="auth-card">
    <h1>Set New Password</h1>
    <div class="auth-sub" id="sub-text">Verifying your reset link…</div>

    <div class="auth-loading" id="checking">One moment.</div>

    <form id="reset-form" style="display:none">
      <div class="auth-field">
        <label for="password">New Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="auth-field">
        <label for="password2">Confirm New Password</label>
        <input type="password" id="password2" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-a auth-submit" id="submit-btn">Update Password</button>
      <div class="auth-msg" id="msg"></div>
    </form>

    <div id="invalid-block" style="display:none">
      <div class="auth-msg err" style="display:block">This reset link is invalid or has expired.</div>
      <div class="auth-alt"><a href="forgot-password.html">Request a new link</a></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.1/dist/umd/supabase.js"></script>
<script src="supabase-config.js?v=202608011016"></script>
<script src="app.js?v=202608011016"></script>
<script src="auth.js?v=202608011016"></script>
<script>
(async function(){
  const checking = document.getElementById('checking');
  const form = document.getElementById('reset-form');
  const invalidBlock = document.getElementById('invalid-block');
  const subText = document.getElementById('sub-text');

  function showForm(){
    checking.style.display = 'none';
    subText.textContent = 'Choose a new password for your account.';
    form.style.display = 'block';
  }
  function showInvalid(){
    checking.style.display = 'none';
    subText.textContent = '';
    invalidBlock.style.display = 'block';
  }

  // Supabase's client parses the recovery token out of the URL hash and
  // establishes a temporary session automatically on load, firing a
  // PASSWORD_RECOVERY event. We listen for that, but also fall back to
  // just checking for any session shortly after — some browsers/redirect
  // chains fire the event before our listener is attached.
  let settled = false;
  window.HFY.auth.onAuthChange(function(_session, event){
    if(settled) return;
    if(event === 'PASSWORD_RECOVERY'){ settled = true; showForm(); }
  });
  setTimeout(async function(){
    if(settled) return;
    const session = await window.HFY.auth.getSession();
    settled = true;
    if(session) showForm(); else showInvalid();
  }, 1200);

  document.getElementById('reset-form').addEventListener('submit', async function(e){
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');
    msg.className = 'auth-msg';
    msg.textContent = '';
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('password2').value;
    if(p1 !== p2){
      msg.className = 'auth-msg err';
      msg.textContent = "Passwords don't match.";
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Updating…';
    try{
      const { error } = await window.HFY.auth.updatePassword(p1);
      if(error) throw error;
      // Sign out the temporary recovery session so they consciously sign
      // back in with the new password, rather than leaving ambiguity about
      // what session they're on.
      await window.HFY.auth.signOut();
      window.location.href = 'login.html?reset=1';
    }catch(err){
      msg.className = 'auth-msg err';
      msg.textContent = err.message || 'Could not update password. Try requesting a new reset link.';
      btn.disabled = false;
      btn.textContent = 'Update Password';
    }
  });
})();
</script>
</body>
</html>
