<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Payment Received | Hustlin'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260812-0251">
<style>
.auth-wrap{min-height:100vh;background:#060606;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.auth-logo{margin-bottom:36px}
.auth-logo img{height:56px;width:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.auth-card{background:var(--dark-card);border:1px solid rgba(240,192,48,.2);border-radius:var(--r-lg);padding:40px;max-width:440px;width:100%}
.auth-card h1{color:#fff;font-size:1.4rem;margin-bottom:10px}
.auth-card p{color:rgba(255,255,255,.55);font-size:.9rem;line-height:1.6;margin-bottom:22px}
.status-icon{font-size:2.4rem;margin-bottom:16px}
/* Only used on this page, so it stays here rather than in styles.css - the
   shared-css gate only cares about classes used across more than one page.
   Hex is literal, not a token: this renders once, at the moment somebody has
   just paid, and it is the worst possible place for a colour to resolve wrong. */
.auth-card p.thanks{color:rgba(255,255,255,.78);border-top:1px solid rgba(240,192,48,.18);padding-top:16px}
.auth-card .btn-a{width:100%;justify-content:center}
</style>
</head>
<body>
<div class="auth-wrap">
  <a class="auth-logo" href="index.html"><img src="assets/hustlin-logo.png" alt="Hustlin'"></a>
  <div class="auth-card" id="card">
    <div class="status-icon">⏳</div>
    <h1>Confirming your payment…</h1>
    <p>This usually takes a few seconds.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.1/dist/umd/supabase.js"></script>
<script src="supabase-config.js?v=20260812-0251"></script>
<script src="app.js?v=20260812-0251"></script>
<script src="auth.js?v=20260812-0251"></script>
<script src="course-access.js?v=20260812-0251"></script>
<script>
(async function(){
  const params = new URLSearchParams(window.location.search);
  const course = params.get('course') || 'ta';
  const courseName = (window.HFY_CONFIG.COURSES[course] && window.HFY_CONFIG.COURSES[course].name) || 'your course';
  const card = document.getElementById('card');

  // First stage the buyer hasn't already read for free. Read from the courses
  // table rather than hardcoded, because free_stages varies per course and
  // changes over time — Technical Analysis went to 0 (no free stage), so
  // the old hardcoded "stage 2" would have skipped a stage they just paid for.
  async function firstPaidStage(){
    try{
      const { data, error } = await window.HFY_SUPABASE
        .from('courses').select('free_stages').eq('key', course).maybeSingle();
      if(error || !data) return 1;
      const free = typeof data.free_stages === 'number' ? data.free_stages : 0;
      return free + 1;
    }catch(e){ console.error('firstPaidStage failed', e); return 1; }
  }

  async function renderOk(){
    const startAt = await firstPaidStage();
    card.innerHTML =
      '<div class="status-icon">✓</div>' +
      '<h2>You\'re in!</h2>' +
      '<p>' + courseName + ' is now unlocked on your account.</p>' +
      // Added 2026-08-10. This is the one moment where the reciprocity argument
      // can be closed rather than made: they already paid, so it is a thank-you,
      // not a pitch. Says what the money did. No upsell here - the all-access
      // cross-sell lives on the course pages, and putting one on a receipt is
      // how "one payment, no upsell ladder" stops being true.
      '<p class="thanks">Thank you &mdash; genuinely. You paid for something you could have waited on, ' +
      'and that is what keeps the free half free. Nothing else to buy, no renewal, ' +
      'and this stays on your account for good.</p>' +
      '<a class="btn-a" href="learn.html?course=' + encodeURIComponent(course) +
      '&amp;stage=' + startAt + '">Start Learning →</a>';
  }
  function renderPending(){
    card.innerHTML =
      '<div class="status-icon">📬</div>' +
      '<h2>Payment received</h2>' +
      '<p>We\'re still confirming this with Stripe — it can take up to a minute. Refresh this page shortly, or head back to the course and it\'ll unlock automatically once confirmed.</p>' +
      '<a class="btn-a" href="javascript:location.reload()">Refresh</a>';
  }
  function renderSignedOut(){
    card.innerHTML =
      '<div class="status-icon">🔑</div>' +
      '<h2>Payment received</h2>' +
      '<p>Sign in with the same email you used at checkout to see your unlocked course.</p>' +
      '<a class="btn-a" href="login.html">Sign In</a>';
  }

  const user = await window.HFY.auth.getUser();
  if(!user){ renderSignedOut(); return; }

  // Poll for the webhook to land (Stripe → Supabase can take a moment).
  for(let i = 0; i < 6; i++){
    const has = await window.HFY.access.checkCourseAccess(course);
    if(has){ await renderOk(); return; }
    await new Promise(r => setTimeout(r, 2000));
  }
  renderPending();
})();
</script>
</body>
</html>
