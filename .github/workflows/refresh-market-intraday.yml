# =============================================================================
#  INTRADAY tier — hustlin.org
# =============================================================================
#
#  Quotes, headlines, the earnings calendar as actuals land, sector performance.
#  The only tier whose data genuinely moves during a trading session, and the
#  only one that justifies an hourly cron.
#
#  WHY HOURLY IS REQUIRED HERE SPECIFICALLY
#
#  The earnings table on Markets/spotlight.html shows TODAY's reporters with
#  their actual EPS and revenue filled in as the numbers land. Finnhub populates
#  epsActual and revenueActual on the calendar row for the current day, so a
#  company reporting before the open is on the page within the hour instead of
#  the next morning. A daily build cannot do that — the whole feature depends on
#  this cadence. If this ever drops back to daily, the "Today" tab degrades to
#  estimates only and the page should say so.
#
#  This is also the tier that pays the ~70s Finnhub cooldown before the earnings
#  fetch. See the FINNHUB COOLDOWN note in tools/inject-market-data.mjs.
#
#  The steps live in refresh-market-core.yml. Do not copy them here.
# =============================================================================

name: Refresh market data (intraday)

on:
  schedule:
    # ── THE TRADING WEEK, HOURLY ──────────────────────────────────────────
    #
    #  Target, in EST (UTC-5): hourly from 18:00 Sunday through 18:00 Friday,
    #  then twice a day at 00:00 and 12:00 across the weekend.
    #
    #  GitHub cron is ALWAYS UTC and does not observe DST, so these are written
    #  against EST and drift one hour later in local terms during EDT (mid-March
    #  to early November): the week then reopens at 19:00 ET and the weekend runs
    #  land at 01:00 and 13:00 ET. That is deliberate. The alternative is two
    #  sets of expressions swapped twice a year, which is a maintenance trap for
    #  an hour of drift on a job whose entire purpose is "roughly current".
    #
    #  Do not merge these into fewer lines. The Sunday reopen and the weekend
    #  pair both land on day 0, and separating them is what keeps the intent
    #  readable when you come back to this in six months.
    #
    #  ── MINUTE 23, NOT MINUTE 0 ─────────────────────────────────────────
    #
    #  GitHub does not guarantee a scheduled run: it queues them on shared
    #  infrastructure and DROPS them under load. Minute 0 is the single most
    #  oversubscribed slot on the platform, because it is what everybody writes.
    #  On minute 0 this workflow was landing 30-50 minutes late and firing
    #  roughly six times a day instead of eighteen. Any minute that is not a
    #  round number is materially better. It is still best-effort: if a run is
    #  genuinely required, use workflow_dispatch.

    # Mon-Fri, hourly at :23 UTC. The bulk of the week.
    - cron: '23 * * * 1-5'

    # Sun 23:23 UTC = Sun 18:23 EST. The reopen — futures are trading and this
    # is the first refresh of the new week. Runs straight into the Monday
    # expression above with no gap.
    - cron: '23 23 * * 0'

    # Sat & Sun 05:23 and 17:23 UTC = 00:23 and 12:23 EST. Two runs a day across
    # the weekend, because nothing prices between Friday's close and Sunday's
    # open and an hourly cadence would burn ~46 no-op jobs for it.
    - cron: '23 5,17 * * 6,0'

  workflow_dispatch:

# Each tier gets its OWN concurrency group. A shared group would make the daily
# job queue behind an hourly one that is mid-Finnhub-cooldown, and a `weekly`
# run cancelled by an `intraday` run is a week of flows data quietly skipped.
concurrency:
  group: refresh-market-intraday
  cancel-in-progress: false

jobs:
  refresh:
    uses: ./.github/workflows/refresh-market-core.yml
    with:
      cadence: intraday
    secrets: inherit
