<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Reset Password | Hustlin'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=202607262240">
<style>
.auth-wrap{min-height:100vh;background:#060606;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.auth-logo{margin-bottom:36px}
.auth-logo img{height:56px;width:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.auth-card{background:var(--dark-card);border:1px solid rgba(240,192,48,.2);border-radius:var(--r-lg);padding:38px;max-width:400px;width:100%}
.auth-card h1{color:#fff;font-size:1.4rem;margin-bottom:6px}
.auth-card .auth-sub{color:rgba(255,255,255,.5);font-size:.88rem;margin-bottom:26px}
.auth-field{margin-bottom:16px}
.auth-field label{display:block;font-size:.8rem;color:rgba(255,255,255,.6);margin-bottom:6px;font-weight:600}
.auth-field input{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#fff;font-size:.95rem}
.auth-field input:focus{outline:none;border-color:var(--amber)}
.auth-submit{width:100%;justify-content:center;margin-top:8px}
.auth-msg{font-size:.85rem;margin-top:14px;padding:10px 12px;border-radius:8px;display:none}
.auth-msg.err{background:rgba(255,34,34,.1);color:#ff8080;border:1px solid rgba(255,34,34,.25);display:block}
.auth-msg.ok{background:rgba(45,160,45,.1);color:#8fe08f;border:1px solid rgba(45,160,45,.25);display:block}
.auth-alt{text-align:center;margin-top:20px;font-size:.86rem;color:rgba(255,255,255,.4)}
.auth-alt a{color:var(--amber);text-decoration:underline}
</style>
</head>
<body>
<div class="auth-wrap">
  <a class="auth-logo" href="index.html"><img src="assets/hustlin-logo.png" alt="Hustlin'"></a>
  <div class="auth-card">
    <h1>Reset Password</h1>
    <div class="auth-sub">Enter your account email and we'll send you a link to set a new password.</div>
    <form id="forgot-form">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <button type="submit" class="btn-a auth-submit" id="submit-btn">Send Reset Link</button>
      <div class="auth-msg" id="msg"></div>
    </form>
    <div class="auth-alt">Remembered it? <a href="login.html">Sign in</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js?v=202607262240"></script>
<script src="app.js?v=202607262240"></script>
<script src="auth.js?v=202607262240"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('msg');
  msg.className = 'auth-msg';
  msg.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try{
    const email = document.getElementById('email').value.trim();
    const { error } = await window.HFY.auth.resetPasswordForEmail(email);
    if(error) throw error;
    msg.className = 'auth-msg ok';
    msg.textContent = "Check your email for a reset link. It'll bring you back here to set a new password.";
    btn.textContent = 'Link Sent';
    // Deliberately don't re-enable the button — resending immediately just
    // invites hammering the endpoint. They can refresh if they need to retry.
  }catch(err){
    msg.className = 'auth-msg err';
    msg.textContent = err.message || 'Could not send reset link. Check the email address and try again.';
    btn.disabled = false;
    btn.textContent = 'Send Reset Link';
  }
});
</script>
</body>
</html>
