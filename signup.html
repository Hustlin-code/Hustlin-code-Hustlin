<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Create Account | Hustlin'</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=202607271109">
<style>
.auth-wrap{min-height:100vh;background:#060606;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.auth-logo{margin-bottom:36px}
.auth-logo img{height:56px;width:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.auth-card{background:var(--dark-card);border:1px solid rgba(240,192,48,.2);border-radius:var(--r-lg);padding:38px;max-width:400px;width:100%}
.auth-card h1{color:#fff;font-size:1.4rem;margin-bottom:6px}
.auth-card .auth-sub{color:rgba(255,255,255,.5);font-size:.88rem;margin-bottom:26px}
.auth-field{margin-bottom:16px}
.auth-field label{display:block;font-size:.8rem;color:rgba(255,255,255,.6);margin-bottom:6px;font-weight:600}
.auth-field input{width:100%;padding:12px 14px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#fff;font-size:.95rem}
.auth-field input:focus{outline:none;border-color:var(--amber)}
.auth-submit{width:100%;justify-content:center;margin-top:8px}
.auth-msg{font-size:.85rem;margin-top:14px;padding:10px 12px;border-radius:8px;display:none}
.auth-msg.err{background:rgba(255,34,34,.1);color:#ff8080;border:1px solid rgba(255,34,34,.25);display:block}
.auth-msg.ok{background:rgba(45,160,45,.1);color:#8fe08f;border:1px solid rgba(45,160,45,.25);display:block}
.auth-alt{text-align:center;margin-top:20px;font-size:.86rem;color:rgba(255,255,255,.4)}
.auth-alt a{color:var(--amber);text-decoration:underline}
.auth-or{display:flex;align-items:center;gap:12px;margin:22px 0 18px}
.auth-or::before,.auth-or::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.12)}
.auth-or span{font-size:.74rem;color:rgba(255,255,255,.32);text-transform:uppercase;letter-spacing:.08em}
.btn-google{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.18);background:#fff;color:#1f1f1f;font-family:var(--f-body);font-size:.92rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-google:hover{background:#f3f3f3;border-color:rgba(255,255,255,.4)}
.btn-google:disabled{opacity:.6;cursor:default}
.btn-google svg{width:18px;height:18px;flex-shrink:0}
</style>
</head>
<body>
<div class="auth-wrap">
  <a class="auth-logo" href="index.html"><img src="assets/hustlin-logo.png" alt="Hustlin'"></a>
  <div class="auth-card">
    <h1>Create Account</h1>
    <div class="auth-sub">Needed to purchase and access paid courses.</div>
    <form id="signup-form">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-a auth-submit" id="submit-btn">Create Account</button>
      <div class="auth-msg" id="msg"></div>
    </form>
    <div class="auth-or"><span>or</span></div>
    <button type="button" class="btn-google" id="google-btn"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continue with Google</button>

    <div class="auth-alt">Already have an account? <a href="login.html">Sign in</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js?v=202607271109"></script>
<script src="app.js?v=202607271109"></script>
<script src="auth.js?v=202607271109"></script>
<script>
function getRedirect(){
  const params = new URLSearchParams(window.location.search);
  return params.get('redirect') || 'index.html';
}
document.getElementById('signup-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('msg');
  msg.className = 'auth-msg';
  msg.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Creating account…';
  try{
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { data, error } = await window.HFY.auth.signUp(email, password);
    if(error) throw error;
    if(data.session){
      // Email confirmation is off — user is signed in immediately.
      window.location.href = getRedirect();
      return;
    }
    // Email confirmation is on — no session yet.
    msg.className = 'auth-msg ok';
    msg.textContent = 'Account created! Check your email for a confirmation link, then sign in.';
    btn.textContent = 'Create Account';
  }catch(err){
    msg.className = 'auth-msg err';
    msg.textContent = err.message || 'Could not create account.';
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
});

document.getElementById('google-btn').addEventListener('click', async function(){
  const btn = this;
  const msg = document.getElementById('msg');
  msg.className = 'auth-msg';
  msg.textContent = '';
  btn.disabled = true;
  try{
    // Hand the post-login destination to auth.js, which stashes it and sends
    // the user to Google. Control returns via auth-callback.html.
    const { error } = await window.HFY.auth.signInWithGoogle(getRedirect());
    if(error) throw error;
  }catch(err){
    msg.className = 'auth-msg err';
    msg.textContent = err.message || 'Could not start Google sign-in.';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
